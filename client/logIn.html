<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Log in</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <!-- place navbar here -->
    </header>
    <main>
      <div class="container col-xl-10 col-xxl-8 px-4 py-5">
        <div class="row align-items-center g-lg-5 py-5">
          <div class="col-lg-7 text-center text-lg-start">
            <h2 class="display-4 fw-bold lh-1 text-body-emphasis mb-3">
              Pro Shop - shop with us quickly and easily!
            </h2>
            <p class="col-lg-10 fs-4">
              Please log in to continue your journey through the world of goods
              with us!
            </p>
          </div>
          <div class="col-md-10 mx-auto col-lg-5">
            <form
              class="p-4 p-md-5 border rounded-3 bg-body-tertiary needs-validation"
              id="check-form"
              novalidate
            >
              <a
                class="d-inline-flex fw-bold gap-2 link-primary mb-4 text-decoration-none"
                href="index.html"
              >
                <i class="hstack fs-5">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="1em"
                    height="1em"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path
                      d="m7.373 12.75 5.696 5.696L12 19.5 4.5 12 12 4.5l1.07 1.054-5.697 5.696H19.5v1.5H7.373Z"
                    ></path>
                  </svg>
                </i>
                Go back
              </a>
              <div class="form-floating mb-3">
                <input
                  type="email"
                  class="form-control"
                  id="email-input"
                  placeholder="email"
                  required
                />
                <label for="floatingInput">Email</label>
                <div class="invalid-feedback" id="emailFeedback">
                  Please enter a valid email
                </div>
              </div>
              <div class="form-floating mb-3 password-wrapper">
                <input
                  type="password"
                  class="form-control"
                  id="password-input"
                  placeholder="password"
                  required
                />
                <button
                  class="btn toggle-password"
                  type="button"
                  id="togglePassword"
                >
                  <i class="bi bi-eye-fill" id="toggleIcon"></i>
                </button>
                <label for="floatingInput">Password</label>
                <div class="invalid-feedback" id="passwordFeedback">
                  Please enter a valid password
                </div>
              </div>
              <div class="checkbox mb-3">
                <label>
                  <input
                    type="checkbox"
                    value="remember-me"
                    id="rememberCheck"
                  />
                  Remember me
                </label>
              </div>
              <div class="mb-4">
                <div
                  class="g-recaptcha captcha"
                  data-sitekey="YOUR_RECAPTCHA_SITE_KEY"
                ></div>
                <p id="captchaFeedback" class="invalid-feedback d-none"></p>
              </div>
              <button
                class="w-100 btn btn-lg btn-primary"
                type="submit logInButton"
              >
                Log in
              </button>
              <p id="backend-response" class="d-none"></p>
              <hr class="my-4" />
              <small class="text-body-secondary"
                >New to Pro Shop? <a href="signUp.html">Sign up</a></small
              >
            </form>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
    <script src="logIn.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.10.0/axios.min.js"
      integrity="sha512-WkZrEcQ5LMyNy6Y2PQf+Tu3vMcsmKKRKuPXtJSTHQJ3mpuvLRlA5dlDDhrrcXfyWr6Z/y3wIMfjfqVFO/gDZYQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  </body>
</html>
